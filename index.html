<!doctype html>
<html lang="en">
<head>

<style>

*{box-sizing:border-box}html{background:var(--bg);color-scheme:dark}body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font-family:var(--sans);font-variant-numeric:tabular-nums}button,input{font:inherit}.topbar{height:52px;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:18px;padding:0 20px;background:#050608;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:10}.brand{display:flex;align-items:center;gap:9px;font:900 italic 14px var(--sans);letter-spacing:-.02em}.mark{width:26px;height:14px;border-top:5px solid var(--red);border-right:5px solid var(--red);transform:skewX(-25deg)}.meeting-line{min-width:0;color:var(--muted);font:700 10px var(--mono);letter-spacing:.09em;text-transform:uppercase;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.connection{display:flex;align-items:center;gap:8px;color:var(--muted);font:800 9px var(--mono);letter-spacing:.1em}.dot{width:7px;height:7px;border-radius:50%;background:var(--green);box-shadow:0 0 10px color-mix(in srgb,var(--green),transparent 30%)}.dot.archive{background:var(--purple);box-shadow:none}.session-rail{display:flex;gap:1px;overflow-x:auto;background:#050608;border-bottom:1px solid var(--line);padding:0 20px;scrollbar-width:none}.session-rail::-webkit-scrollbar{display:none}.session-button{min-width:92px;height:52px;padding:7px 14px;border:0;border-bottom:3px solid transparent;background:transparent;color:var(--muted);text-align:left;cursor:pointer}.session-button b{display:block;color:inherit;font:800 11px var(--mono);letter-spacing:.04em;white-space:nowrap}.session-button small{display:block;margin-top:4px;font:600 8px var(--mono);letter-spacing:.07em;text-transform:uppercase}.session-button:hover{background:var(--panel);color:var(--ink)}.session-button.active{border-color:var(--red);background:var(--panel);color:var(--ink)}.session-button.live small{color:var(--green)}
.workspace{width:min(1600px,100%);margin:auto;padding:18px 20px 36px}.command{display:grid;grid-template-columns:minmax(280px,1fr) auto;gap:18px;align-items:end;margin-bottom:14px}.session-id{display:flex;align-items:center;gap:14px;min-width:0}.session-code{display:grid;place-items:center;min-width:50px;height:50px;background:var(--red);font:950 italic 20px var(--sans);clip-path:polygon(0 0,100% 0,100% 37px,37px 100%,0 100%)}h1{margin:0;font:900 25px/1 var(--sans);letter-spacing:-.035em;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.subline{display:flex;gap:10px;margin-top:7px;color:var(--muted);font:700 9px var(--mono);letter-spacing:.08em;text-transform:uppercase}.session-kpis{display:flex;gap:1px;background:var(--line)}.kpi{min-width:108px;padding:10px 12px;background:var(--panel)}.kpi small{display:block;color:var(--muted);font:700 8px var(--mono);letter-spacing:.12em;text-transform:uppercase}.kpi strong{display:block;margin-top:5px;font:900 15px var(--mono)}.kpi strong.purple{color:var(--purple)}
.conditions{display:flex;align-items:center;gap:0;border:1px solid var(--line);background:var(--rail);overflow-x:auto}.condition{min-width:105px;padding:9px 13px;border-right:1px solid var(--line)}.condition:last-child{border:0}.condition small{display:block;color:var(--muted);font:700 7px var(--mono);letter-spacing:.12em;text-transform:uppercase}.condition strong{display:block;margin-top:4px;font:800 11px var(--mono)}.condition .unit{color:var(--muted);font-size:8px}.spacer{flex:1;min-width:12px}.model{display:flex;align-items:center;gap:8px;padding:0 12px;color:var(--muted);font:700 8px var(--mono);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}.model input{width:58px;padding:5px 4px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:800 11px var(--mono);text-align:center}
.view-tabs{display:flex;gap:1px;margin-top:14px;background:var(--line);border:1px solid var(--line);overflow-x:auto;scrollbar-width:none}.tab{height:42px;min-width:116px;flex:1;border:0;background:var(--rail);color:var(--muted);font:800 9px var(--mono);letter-spacing:.11em;text-transform:uppercase;cursor:pointer}.tab:hover{background:var(--panel2);color:var(--ink)}.tab.active{background:var(--ink);color:var(--bg)}.tab .count{margin-left:5px;color:var(--red)}.view{display:none;margin-top:10px}.view.active{display:block}.panel{min-width:0;background:var(--panel);border:1px solid var(--line)}.panel-head{min-height:42px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 14px;border-bottom:1px solid var(--line);font:800 9px var(--mono);letter-spacing:.12em;text-transform:uppercase}.panel-head span{color:var(--muted);font-size:8px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th{height:32px;padding:0 10px;background:#090b0e;color:var(--muted);text-align:left;font:700 8px var(--mono);letter-spacing:.1em;text-transform:uppercase;white-space:nowrap}td{height:48px;padding:6px 10px;border-top:1px solid var(--line);font:700 11px var(--mono);white-space:nowrap}tbody tr:hover{background:var(--panel2)}.position{width:42px;text-align:center;font:950 italic 18px var(--sans)}.driver{display:flex;align-items:center;gap:9px;border-left:4px solid;padding-left:9px}.driver b{display:block;color:var(--ink);font:900 italic 14px var(--sans)}.driver small{display:block;max-width:150px;margin-top:2px;color:var(--muted);font:700 7px var(--mono);text-transform:uppercase;overflow:hidden;text-overflow:ellipsis}.positive{color:var(--green)}.negative{color:var(--red)}.purple{color:var(--purple)}.cyan{color:var(--cyan)}.muted{color:var(--muted)}.tyre{display:inline-grid;place-items:center;width:20px;height:20px;border:3px solid var(--tyre);border-radius:50%;color:var(--tyre);font:900 8px var(--sans)}.spark{color:var(--green);vertical-align:middle}.spark .base{stroke:#3a424e;stroke-width:.7}.status{padding:3px 5px;background:var(--red);color:white;font:800 8px var(--mono)}.empty{padding:40px 16px!important;color:var(--muted);text-align:center;font:700 10px var(--mono);letter-spacing:.08em;text-transform:uppercase}
.pace-grid{display:grid;grid-template-columns:minmax(0,2fr) minmax(260px,.7fr);gap:10px}.mini{display:flex;gap:2px}.mini i{width:7px;height:13px;background:#353b44}.mini .y{background:#e7c63a}.mini .g{background:#32c870}.mini .p{background:#a868ee}.mini .pit{background:#737b86}.benchmark{padding:16px}.benchmark-row{display:grid;grid-template-columns:42px 1fr auto;gap:10px;align-items:center;margin:10px 0;font:700 9px var(--mono)}.bar{height:7px;background:#232a33;overflow:hidden}.bar i{display:block;height:100%;background:var(--purple)}
.strategy-list{display:grid}.strategy-row{display:grid;grid-template-columns:50px minmax(120px,1.4fr) minmax(240px,3fr) repeat(4,minmax(70px,.65fr));align-items:center;min-height:62px;border-top:1px solid var(--line)}.strategy-row:first-child{border-top:0}.strategy-row>div{padding:8px 11px}.stints{display:flex;height:18px;gap:2px}.stint{min-width:13px;height:100%;display:grid;place-items:center;border:2px solid var(--tyre);color:var(--tyre);font:900 7px var(--mono)}.metric small{display:block;color:var(--muted);font:700 7px var(--mono);letter-spacing:.08em;text-transform:uppercase}.metric b{display:block;margin-top:4px;font:800 12px var(--mono)}
.track-grid{display:grid;grid-template-columns:minmax(340px,1.2fr) minmax(0,1.8fr);gap:10px}.map{min-height:520px;display:grid;place-items:center;padding:20px;background:radial-gradient(circle at 50% 45%,#171c23 0,#0b0e12 63%);position:relative}.map svg{width:100%;height:auto;max-height:480px;overflow:visible}.track-line{fill:none;stroke:#68717d;stroke-width:1.2;stroke-linecap:round;stroke-linejoin:round;vector-effect:non-scaling-stroke}.car-dot{stroke:#080a0d;stroke-width:.8;vector-effect:non-scaling-stroke}.car-label{fill:#fff;font:800 2.6px var(--mono);paint-order:stroke;stroke:#080a0d;stroke-width:.8px}.map-note{position:absolute;left:14px;bottom:12px;color:var(--muted);font:700 7px var(--mono);letter-spacing:.08em;text-transform:uppercase}.telemetry-gauge{display:flex;align-items:center;gap:8px}.gauge{width:74px;height:5px;background:#29303a}.gauge i{display:block;height:100%;background:var(--cyan)}
.feed-grid,.standings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.feed{list-style:none;margin:0;padding:0;max-height:650px;overflow:auto}.feed li{display:grid;grid-template-columns:58px 55px 1fr;gap:10px;align-items:start;padding:11px 13px;border-top:1px solid var(--line);font:650 10px/1.45 var(--mono)}.feed li:first-child{border:0}.feed time{color:var(--muted);font-size:8px}.event-kind{padding:3px 4px;background:#29303a;text-align:center;color:var(--cyan);font:800 7px var(--mono);letter-spacing:.06em}.event-kind.control{color:var(--amber)}.event-kind.radio{color:var(--purple)}.event-kind.pit{color:var(--red)}.event-label{display:block;margin-bottom:3px;color:var(--ink);font-size:8px;letter-spacing:.07em}.feed audio{display:block;width:210px;height:24px;margin-top:6px}.standings-list{display:grid}.standing{display:grid;grid-template-columns:38px 1fr auto auto;gap:12px;align-items:center;min-height:49px;padding:8px 13px;border-top:1px solid var(--line);font:800 10px var(--mono)}.standing:first-child{border-top:0}.standing .rank{font:950 italic 17px var(--sans)}.standing .points{color:var(--purple)}.standing .change{width:38px;text-align:right;color:var(--muted)}
#transport{display:none;align-items:center;gap:12px;margin-top:10px;padding:9px 12px;background:var(--rail);border:1px solid var(--line)}#transport.on{display:flex}#play{width:34px;height:28px;border:0;background:var(--ink);color:var(--bg);cursor:pointer}#scrub{flex:1;accent-color:var(--red)}#tick{min-width:100px;color:var(--muted);font:700 8px var(--mono);text-align:right}.error{background:var(--red)!important;color:#fff!important}.error .dot{background:#fff}.footer{display:flex;justify-content:space-between;gap:12px;padding:13px 2px;color:var(--muted);font:600 7px var(--mono);letter-spacing:.08em;text-transform:uppercase}
@media(max-width:1000px){.command{grid-template-columns:1fr}.session-kpis{justify-self:stretch}.kpi{flex:1}.pace-grid,.track-grid{grid-template-columns:1fr}.map{min-height:400px}.strategy-row{grid-template-columns:42px 1.2fr 2.5fr repeat(2,minmax(65px,.7fr))}.strategy-row .less{display:none}}
@media(max-width:700px){.topbar{padding:0 10px;gap:9px}.meeting-line{display:none}.session-rail{padding:0 8px}.session-button{min-width:72px;padding:7px 9px}.workspace{padding:12px 8px 24px}.command{gap:12px}.session-code{min-width:44px;height:44px}h1{font-size:19px}.session-kpis{overflow:auto}.kpi{min-width:92px}.conditions{align-items:stretch}.condition{min-width:84px}.spacer{display:none}.model{min-width:148px}.view-tabs{margin-top:10px}.tab{min-width:96px}.optional{display:none}.driver small{display:none}.feed-grid,.standings-grid{grid-template-columns:1fr}.strategy-row{grid-template-columns:38px 1fr 1.8fr minmax(64px,.6fr)}.strategy-row .mobile-hide{display:none}.map{min-height:320px;padding:8px}.footer{display:block;line-height:1.7}.feed audio{width:180px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>
</head>
<body>
<header class="topbar"><div class="brand"><span class="mark" aria-hidden="true"></span>PIT WALL</div><div class="meeting-line" id="meetingLine">OPENF1 / CONNECTING</div><div class="connection" id="connection"><span class="dot"></span><span id="connectionText">CONNECTING</span></div></header>
<nav class="session-rail" id="sessions" aria-label="Race weekend sessions"></nav>
<main class="workspace">
  <section class="command" aria-label="Current session">
    <div class="session-id"><div class="session-code" id="sessionCode">—</div><div><h1 id="sessionTitle">Loading session</h1><div class="subline"><span id="sessionPlace">—</span><span id="sessionTime">—</span></div></div></div>
    <div class="session-kpis"><div class="kpi"><small>Status</small><strong id="sessionStatus">—</strong></div><div class="kpi"><small>Phase / lap</small><strong class="purple" id="phase">—</strong></div><div class="kpi"><small>Session best</small><strong id="sessionBest">—</strong></div><div class="kpi"><small>Updated</small><strong id="updated">—</strong></div></div>
  </section>
  <section class="conditions" aria-label="Track conditions"><div class="condition"><small>Air</small><strong><span id="air">—</span><span class="unit"> °C</span></strong></div><div class="condition"><small>Track</small><strong><span id="trackTemp">—</span><span class="unit"> °C</span></strong></div><div class="condition"><small>Wind</small><strong><span id="wind">—</span><span class="unit"> m/s</span></strong></div><div class="condition"><small>Humidity</small><strong><span id="humidity">—</span><span class="unit"> %</span></strong></div><div class="condition"><small>Rain</small><strong id="rain">—</strong></div><div class="spacer"></div><label class="model">Pit loss <input id="pitLossInput" type="number" min="10" max="45" step="0.5" value="22" aria-label="Pit loss in seconds"> sec</label></section>
  <div id="transport"><button id="play" aria-label="Play replay">▶</button><input id="scrub" type="range" min="0" max="0" value="0" aria-label="Replay position"><span id="tick"></span></div>
  <nav class="view-tabs" aria-label="Dashboard views"><button class="tab active" data-view="timing">Timing</button><button class="tab" data-view="pace">Pace</button><button class="tab" data-view="strategy">Strategy</button><button class="tab" data-view="track">Track</button><button class="tab" data-view="feed">Feed <span class="count" id="feedCount"></span></button><button class="tab" data-view="standings">Standings</button></nav>
  <section class="view active" id="timing"></section><section class="view" id="pace"></section><section class="view" id="strategy"></section><section class="view" id="track"></section><section class="view" id="feed"></section><section class="view" id="standings"></section>
  <footer class="footer"><span>OpenF1 timing and telemetry · historical sessions from 2023</span><span id="coverage">0 drivers · 0 laps · 0 events</span></footer>
</main>
<script>
const $=id=>document.getElementById(id),els={sessions:$('sessions'),meetingLine:$('meetingLine'),connection:$('connection'),connectionText:$('connectionText'),sessionCode:$('sessionCode'),sessionTitle:$('sessionTitle'),sessionPlace:$('sessionPlace'),sessionTime:$('sessionTime'),sessionStatus:$('sessionStatus'),phase:$('phase'),sessionBest:$('sessionBest'),updated:$('updated'),air:$('air'),trackTemp:$('trackTemp'),wind:$('wind'),humidity:$('humidity'),rain:$('rain'),pitLoss:$('pitLossInput'),feedCount:$('feedCount'),coverage:$('coverage'),transport:$('transport'),play:$('play'),scrub:$('scrub'),tick:$('tick')};
const TYRE={SOFT:'#ff3848',MEDIUM:'#ffd236',HARD:'#f2f2ee',INTERMEDIATE:'#44d05e',WET:'#3d8cff',UNKNOWN:'#747d89'};
const code={'Practice 1':'FP1','Practice 2':'FP2','Practice 3':'FP3','Qualifying':'Q','Sprint Qualifying':'SQ','Sprint Shootout':'SQ','Sprint':'S','Race':'R'};
const show=v=>v===null||v===undefined||v===''?'—':v,esc=v=>String(show(v)).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),num=v=>v===null||v===undefined||v===''?NaN:Number(v),fmt=(v,d=3)=>Number.isFinite(num(v))?num(v).toFixed(d):'—';
const lapTime=v=>{v=num(v);if(!Number.isFinite(v))return'—';const m=Math.floor(v/60);return`${m}:${(v-m*60).toFixed(3).padStart(6,'0')}`};
const gap=v=>{const n=num(v);return Number.isFinite(n)?n===0?'—':`+${n.toFixed(3)}`:show(v)},clock=v=>{const d=new Date(v);return Number.isNaN(+d)?'—':d.toLocaleTimeString([],{hour:'2-digit',minute:'2-digit',second:'2-digit'})},dateTime=v=>{const d=new Date(v);return Number.isNaN(+d)?'—':d.toLocaleString([],{weekday:'short',hour:'2-digit',minute:'2-digit'})};
const colour=v=>String(v||'747d89').replace(/[^0-9a-f]/gi,'').slice(0,6)||'747d89',compound=v=>v==='INTERMEDIATE'?'I':v==='WET'?'W':v?String(v)[0]:'?',safeUrl=v=>String(v||'').startsWith('https://')?esc(v):'';
let state=null,currentSession='',replayMode=false,refreshTimer=null,loadSequence=0;
function statusOf(s){if(replayMode)return'ARCHIVE';if(!s?.date_start)return'LIVE';const now=Date.now(),start=+new Date(s.date_start),end=+new Date(s.date_end);return now<start?'UPCOMING':now<=end+300000?'LIVE':'FINAL'}
function driverCell(r){return`<div class="driver" style="border-color:#${colour(r.team_colour)}"><span class="muted">${esc(r.driver_number)}</span><span><b>${esc(r.name)} ${r.status?`<em class="status">${esc(r.status)}</em>`:''}</b><small>${esc(r.team)}</small></span></div>`}
function tyre(r){const c=TYRE[r.compound]||TYRE.UNKNOWN;return`<span class="tyre" style="--tyre:${c}" title="${esc(r.compound)}">${esc(compound(r.compound))}</span> <span class="muted">${r.tyre_age_laps??'—'}L</span>`}
function spark(r){return r.pace_sparkline_path?`<svg class="spark" width="100" height="30" viewBox="0 0 96 28" aria-label="Recent lap trend"><path class="base" d="M0 14H96"/><path d="${esc(r.pace_sparkline_path)}" fill="none" stroke="currentColor" stroke-width="1.6"/></svg>`:'—'}
function mini(values=[]){return`<div class="mini" title="Latest mini-sectors">${values.map(v=>`<i class="${v===2048?'y':v===2049?'g':v===2051?'p':v===2064?'pit':''}"></i>`).join('')}</div>`}
function renderSessions(s){els.sessions.innerHTML=(s.sessions||[]).map(x=>{const active=String(x.session_key)===String(s.session?.session_key),st=statusOf(x);return`<button class="session-button ${active?'active':''} ${st==='LIVE'?'live':''}" data-session="${esc(x.session_key)}"><b>${esc(code[x.session_name]||x.session_name)}</b><small>${st==='FINAL'?'Complete':st==='LIVE'?'Live':dateTime(x.date_start)}</small></button>`}).join('')}
function renderChrome(s){const info=s.session||{},meeting=s.meeting||{},best=Math.min(...(s.board||[]).map(r=>num(r.best_lap_seconds)).filter(Number.isFinite));renderSessions(s);els.meetingLine.textContent=`${meeting.meeting_name||info.country_name||'OPENF1'} / ${info.circuit_short_name||info.location||'SESSION'}`;els.sessionCode.textContent=code[info.session_name]||String(info.session_name||'—').slice(0,3).toUpperCase();els.sessionTitle.textContent=info.session_name||'Session';els.sessionPlace.textContent=[info.location,info.country_name].filter(Boolean).join(' · ')||'—';els.sessionTime.textContent=dateTime(info.date_start);const status=statusOf(info);els.sessionStatus.textContent=status;els.connectionText.textContent=replayMode?'REPLAY':status==='LIVE'?'LIVE FEED':'OPENF1';els.connection.querySelector('.dot').className=`dot ${replayMode||status!=='LIVE'?'archive':''}`;els.phase.textContent=s.phase||(s.lap_number?`LAP ${s.lap_number}`:info.session_type||'—');els.sessionBest.textContent=Number.isFinite(best)?lapTime(best):'—';els.updated.textContent=replayMode?'FRAME':clock(s.generated_utc);const w=s.weather||{};els.air.textContent=show(w.air_temperature);els.trackTemp.textContent=show(w.track_temperature);els.wind.textContent=show(w.wind_speed);els.humidity.textContent=show(w.humidity);els.rain.textContent=w.rainfall===undefined?'—':w.rainfall?'YES':'NO';els.pitLoss.value=s.pit_loss_seconds??22;els.feedCount.textContent=(s.events||[]).length||'';els.coverage.textContent=`${(s.board||[]).length} drivers · ${(s.board||[]).reduce((n,r)=>n+(r.laps_completed||0),0)} laps · ${(s.events||[]).length} events`}
function timingView(s){const race=['Race','Sprint'].includes(s.session_type),qual=String(s.session_type).includes('Qualifying');let headers,rows;if(race){headers='<th>Pos</th><th>Driver</th><th>Gap</th><th>Interval</th><th>Tyre</th><th>Last 3</th><th class="optional">Stops</th><th class="optional">From grid</th><th>Rejoin</th>';rows=s.board.map(r=>`<tr><td class="position">${esc(r.position)}</td><td>${driverCell(r)}</td><td class="${r.position===1?'purple':''}">${r.position===1?'LEADER':esc(gap(r.gap_to_leader))}</td><td>${esc(gap(r.interval))}</td><td>${tyre(r)}</td><td class="positive">${lapTime(r.recent_pace_seconds)}</td><td class="optional">${r.pit_stops||0}</td><td class="optional ${num(r.position_change)>0?'positive':num(r.position_change)<0?'negative':''}">${num(r.position_change)>0?'▲ ':num(r.position_change)<0?'▼ ':''}${Math.abs(num(r.position_change))||'—'}</td><td><b>${r.estimated_rejoin_position?`P${esc(r.estimated_rejoin_position)}`:'—'}</b></td></tr>`).join('')}else{headers=`<th>Pos</th><th>Driver</th><th>Best</th><th>Gap</th><th>Laps</th>${qual?'<th>Q1</th><th>Q2</th><th>Q3</th>':'<th>S1</th><th>S2</th><th>S3</th>'}<th>Tyre</th>`;rows=s.board.map(r=>`<tr><td class="position">${esc(r.position)}</td><td>${driverCell(r)}</td><td class="${r.position===1?'purple':'positive'}">${lapTime(r.best_lap_seconds)}</td><td>${r.position===1?'—':gap(r.gap_to_best_seconds)}</td><td>${esc(r.laps_completed)}</td>${(qual?[r.q1,r.q2,r.q3]:r.best_sectors).map(v=>`<td>${lapTime(v)}</td>`).join('')}<td>${tyre(r)}</td></tr>`).join('')}$('timing').innerHTML=`<div class="panel"><div class="panel-head">${race?'Live order':'Session classification'}<span>${race?'Intervals · tyres · pit window':'Best lap order · sector detail'}</span></div><div class="table-wrap"><table><thead><tr>${headers}</tr></thead><tbody>${rows||'<tr><td class="empty" colspan="10">No timing data</td></tr>'}</tbody></table></div></div>`}
function paceView(s){const ranked=[...s.board].sort((a,b)=>(num(a.best_lap_seconds)||Infinity)-(num(b.best_lap_seconds)||Infinity)),max=Math.max(...ranked.map(r=>num(r.gap_to_best_seconds)).filter(Number.isFinite),1);$('pace').innerHTML=`<div class="pace-grid"><div class="panel"><div class="panel-head">Lap analysis<span>Best · latest · sectors · speed trap</span></div><div class="table-wrap"><table><thead><tr><th>Driver</th><th>Best</th><th>Delta</th><th>Last</th><th>S1</th><th>S2</th><th>S3</th><th>Trap</th><th>Trend</th><th>Mini sectors</th></tr></thead><tbody>${ranked.map(r=>`<tr><td>${driverCell(r)}</td><td class="purple">${lapTime(r.best_lap_seconds)}</td><td>${gap(r.gap_to_best_seconds)}</td><td>${lapTime(r.last_lap_seconds)}</td>${r.best_sectors.map(v=>`<td>${lapTime(v)}</td>`).join('')}<td class="cyan">${show(r.speed_trap)} <span class="muted">km/h</span></td><td>${spark(r)}</td><td>${mini(r.mini_sectors)}</td></tr>`).join('')||'<tr><td class="empty" colspan="10">No lap data</td></tr>'}</tbody></table></div></div><aside class="panel"><div class="panel-head">Gap to session best<span>Seconds</span></div><div class="benchmark">${ranked.filter(r=>Number.isFinite(num(r.gap_to_best_seconds))).map(r=>`<div class="benchmark-row"><b>${esc(r.name)}</b><span class="bar"><i style="width:${Math.max(2,100-num(r.gap_to_best_seconds)/max*100)}%"></i></span><span>+${fmt(r.gap_to_best_seconds)}</span></div>`).join('')||'<div class="empty">No representative laps</div>'}</div></aside></div>`}
function strategyView(s){$('strategy').innerHTML=`<div class="panel"><div class="panel-head">Tyres and pit windows<span>Pit loss model ${fmt(s.pit_loss_seconds,1)} sec</span></div><div class="strategy-list">${s.board.map(r=>{const total=Math.max(1,...(r.stint_history||[]).map(t=>num(t.laps)));return`<div class="strategy-row"><div class="position">${esc(r.position)}</div><div>${driverCell(r)}</div><div class="stints">${(r.stint_history||[]).map(t=>`<span class="stint" style="--tyre:${TYRE[t.compound]||TYRE.UNKNOWN};flex:${Math.max(1,num(t.laps)/total)}" title="${esc(t.compound)} · ${esc(t.laps)} laps">${compound(t.compound)}</span>`).join('')||'<span class="muted">NO STINT DATA</span>'}</div><div class="metric mobile-hide"><small>Current</small><b>${esc(r.compound)} · ${r.tyre_age_laps??'—'}L</b></div><div class="metric less"><small>Stops / last</small><b>${r.pit_stops||0} / ${fmt(r.last_stop_seconds,1)}s</b></div><div class="metric less"><small>Lane time</small><b>${fmt(r.lane_time_seconds,1)}s</b></div><div class="metric"><small>Rejoin</small><b>${r.estimated_rejoin_position?`P${esc(r.estimated_rejoin_position)}`:'—'}</b></div></div>`}).join('')||'<div class="empty">No strategy data</div>'}</div></div>`}
function trackView(s){const outline=s.track?.outline||[],cars=s.track?.cars||[],poly=outline.map(p=>`${p.x},${p.y}`).join(' ');$('track').innerHTML=`<div class="track-grid"><div class="panel"><div class="panel-head">Track position<span>Latest OpenF1 coordinates</span></div><div class="map">${poly?`<svg viewBox="0 0 100 100" role="img" aria-label="Live car locations"><polyline class="track-line" points="${poly}"/>${cars.map(c=>`<circle class="car-dot" cx="${c.x}" cy="${c.y}" r="1.7" fill="#${colour(c.team_colour)}"/><text class="car-label" x="${c.x+2.2}" y="${c.y+1}">${esc(c.name)}</text>`).join('')}</svg>`:'<div class="empty">Location stream unavailable for this frame</div>'}<span class="map-note">Relative coordinates · schematic view</span></div></div><div class="panel"><div class="panel-head">Car telemetry<span>~3.7 Hz source · latest sample</span></div><div class="table-wrap"><table><thead><tr><th>Driver</th><th>Speed</th><th>Gear</th><th>RPM</th><th>Throttle</th><th>Brake</th><th>DRS</th></tr></thead><tbody>${s.board.map(r=>{const t=r.telemetry||{},th=Math.min(100,num(t.throttle)||0);return`<tr><td>${driverCell(r)}</td><td class="cyan">${show(t.speed)} <span class="muted">km/h</span></td><td>${show(t.n_gear)}</td><td>${show(t.rpm)}</td><td><div class="telemetry-gauge"><span class="gauge"><i style="width:${th}%"></i></span>${Number.isFinite(num(t.throttle))?th:'—'}%</div></td><td class="${num(t.brake)>0?'negative':''}">${num(t.brake)>0?'ON':'OFF'}</td><td class="${[10,12,14].includes(num(t.drs))?'positive':''}">${[10,12,14].includes(num(t.drs))?'OPEN':'OFF'}</td></tr>`}).join('')||'<tr><td class="empty" colspan="7">No car telemetry</td></tr>'}</tbody></table></div></div></div>`}
function feedList(events){return events.length?events.map(e=>`<li><time>${clock(e.date)}</time><span class="event-kind ${String(e.kind||'').toLowerCase()}">${esc(e.kind)}</span><span><b class="event-label">${esc(e.label)}${e.lap?` · L${esc(e.lap)}`:''}${e.phase?` · Q${esc(e.phase)}`:''}</b>${esc(e.message)}${safeUrl(e.url)?`<audio controls preload="none" src="${safeUrl(e.url)}"></audio>`:''}</span></li>`).join(''):'<li class="empty">No events</li>'}
function feedView(s){const events=[...(s.events||[])].reverse(),radio=events.filter(e=>e.kind==='RADIO');$('feed').innerHTML=`<div class="feed-grid"><div class="panel"><div class="panel-head">Session feed<span>${events.length} events</span></div><ol class="feed">${feedList(events)}</ol></div><div class="panel"><div class="panel-head">Team radio<span>Availability varies by session</span></div><ol class="feed">${feedList(radio)}</ol></div></div>`}
function standingsView(s){const driverName=n=>s.board.find(r=>String(r.driver_number)===String(n))?.full_name||n,list=(rows,type)=>rows.length?rows.map(r=>{const current=num(r.position_current),start=num(r.position_start),change=start-current;return`<div class="standing"><span class="rank">${show(r.position_current)}</span><b>${esc(type==='driver'?driverName(r.driver_number):r.team_name)}</b><span class="points">${show(r.points_current)} PTS</span><span class="change ${change>0?'positive':change<0?'negative':''}">${change>0?'▲':change<0?'▼':'—'} ${Math.abs(change)||''}</span></div>`}).join(''):'<div class="empty">Available for race sessions</div>';$('standings').innerHTML=`<div class="standings-grid"><div class="panel"><div class="panel-head">Drivers championship<span>Before / after session</span></div><div class="standings-list">${list(s.championship_drivers||[],'driver')}</div></div><div class="panel"><div class="panel-head">Constructors championship<span>Before / after session</span></div><div class="standings-list">${list(s.championship_teams||[],'team')}</div></div></div>`}
function render(s,replay=replayMode){state=s;replayMode=replay;if(!replay&&!s.follow_latest&&s.session?.session_key)currentSession=String(s.session.session_key);renderChrome(s);timingView(s);paceView(s);strategyView(s);trackView(s);feedView(s);standingsView(s)}
async function load(sessionKey=currentSession){const sequence=++loadSequence;if(sessionKey)currentSession=String(sessionKey);els.connection.classList.remove('error');els.connectionText.textContent='SYNCING';try{const selected=currentSession?`&session_key=${encodeURIComponent(currentSession)}`:'',url=`/state.json?pit_loss=${encodeURIComponent(els.pitLoss.value)}${selected}`,r=await fetch(url);if(!r.ok)throw Error(`${r.status} ${r.statusText}`);const next=await r.json();if(sequence===loadSequence)render(next,false)}catch(e){if(sequence===loadSequence){els.connection.classList.add('error');els.connectionText.textContent='FEED ERROR';els.meetingLine.textContent=e.message}}}
document.querySelector('.view-tabs').onclick=e=>{const button=e.target.closest('[data-view]');if(!button)return;document.querySelectorAll('.tab,.view').forEach(x=>x.classList.remove('active'));button.classList.add('active');$(button.dataset.view).classList.add('active')};
els.sessions.onclick=e=>{const button=e.target.closest('[data-session]');if(button&&!replayMode)load(button.dataset.session)};els.pitLoss.onchange=()=>{if(!replayMode)load()};
async function boot(){try{const r=await fetch('/snapshots.json');if(r.ok){const snaps=await r.json();let i=Math.max(0,snaps.findIndex(x=>(x.lap_number||0)>=10)),timer=null;replayMode=true;els.transport.classList.add('on');els.scrub.max=snaps.length-1;const stop=()=>{clearInterval(timer);timer=null;els.play.textContent='▶'},draw=()=>{render(snaps[i],true);els.scrub.value=i;els.tick.textContent=`FRAME ${i+1} / ${snaps.length}`};els.scrub.oninput=()=>{i=+els.scrub.value;stop();draw()};els.play.onclick=()=>{if(timer)return stop();els.play.textContent='Ⅱ';timer=setInterval(()=>{if(i>=snaps.length-1)return stop();i++;draw()},850)};draw();return}}catch(e){}const refresh=async()=>{await load();refreshTimer=setTimeout(refresh,10000)};await refresh()}
boot();
</script>
